name: homework_and_chores
description: "Local-only gamified household chores app"
publish_to: 'none'

# SemVer: MAJOR.MINOR.PATCH+BUILD. BUILD = Android versionCode and must always increase.
# Bump with tool/bump_version.ps1 and record changes in CHANGELOG.md.
version: 0.13.1+21
environment:
  sdk: ^3.13.1

# Rule: no dependency may use the network, collect analytics or need Google Play Services.
dependencies:
  audioplayers: ^6.8.1
  clock: ^1.1.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  # Already used by drift; direct for checking backup files before opening them.
  sqlite3: ^3.5.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Fight sounds, generated by tool/generate_sounds.py (CC0, our own).
    - assets/sounds/
    - assets/fonts/OFL.txt
  fonts:
    # Pixel font for headings, SIL Open Font License (assets/fonts/OFL.txt).
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
