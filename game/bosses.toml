#:schema ./schema/bosses.json
# The bosses: names, which quests feed them, how they play and the curse they
# leave after winning. Keys are stored in people's databases: never rename or
# remove one. A new boss also needs its drawing in code (see README.md).

[bosses.dust]
name = { en = "Dust Bunny King", de = "Staubhasen-König" }
fed_by = { en = "dusting, floors", de = "Staub, Böden" }
trophy = { en = "Grand Feather Duster", de = "Großer Staubwedel" }
tempo = { bpm = 96, offbeat = 0.0, eighth = 0.3 }
curse = { kind = "tight_timing", name = { en = "Sneezing Fit", de = "Niesanfall" } }

[bosses.laundry]
