#:schema ./schema/items.json
# Everything a hero can own: gear, consumables, hats and screen-time vouchers.
# See README.md for the fields and the effects. Keys are stored in people's
# databases: never rename or remove one; set `retired = true` instead.
#
# Gear needs an icon at assets/art/items/<key>.png (16x16, items palette).
# Descriptions are written from the effects; `flavor` adds an optional line.

