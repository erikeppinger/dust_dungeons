#:schema ./schema/quests.json
# The built-in quests every phone gets. A quest added here appears on every
# phone after the update; existing ones are never changed on a phone, so
# editing one only affects new installs. Keys are stored: never rename or
# remove one.

[quests.dusting]
title = { en = "Dusting", de = "Staub wischen" }
icon = "auto_awesome"
color = 6
points = 15
repeat = { type = "after_done", every = 7 }
boss = "dust"

