#:schema ./schema/overlords.json
# The weekly Overlords: the parts they're built from, their colors, traits,
# names and the holiday Overlords. See docs/design/weekly-overlords.md.
#
# Part keys are stored with every Overlord fight: never rename or remove one.
# The lists only grow at the end, and only together with a new [[eras]] entry,
# so the weeks before stay as they were. Every part needs its drawing in
# assets/art/bosses/overlord/<kind>/<key>.png.

# Names and titles, written as whole pairs (not word by word). German titles
# need no gender, so any title fits any name.
names = [
  { en = "Grimeclaw", de = "Schmierklaue" },
  { en = "Moldmaw", de = "Schimmelschlund" },
  { en = "Crumblebeard", de = "Krümelbart" },
  { en = "Fluffgrub", de = "Fusselfratz" },
