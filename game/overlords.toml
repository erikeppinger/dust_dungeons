# The parts every week picks from, in order.
[parts]
body = ["robe", "armor", "blob", "sleeves", "spider", "serpent"]
face = ["grin", "angry", "cyclops", "specs", "sleepy", "three"]
hat = ["crown", "horns", "wizard", "bucket", "colander", "chef"]
item = ["plunger", "fork", "brush", "duster", "spatula", "mop"]
extra = ["none", "cape", "flies", "sparkles", "wings", "tentacles"]
scheme = ["violet", "crimson", "moss", "midnight", "rust", "teal", "ash", "plum"]

# From which Monday how many of each list are in use. A new era starts the
# weekly order over with the bigger lists. Every count needs at least 3.
[[eras]]
from = "2024-01-01"
body = 6
face = 6
hat = 6
item = 6
extra = 6
scheme = 8
name = 24
title = 24

# Main and light (skin) color; the app makes the darker shades.
[schemes]
violet = { main = "#5E35B1", light = "#B39DDB" }
crimson = { main = "#B0283C", light = "#F0B4AA" }
moss = { main = "#387846", light = "#BEDC96" }
midnight = { main = "#283C82", light = "#A0BEE6" }
rust = { main = "#B85C28", light = "#F6CEA0" }
teal = { main = "#007978", light = "#B2E6D2" }
ash = { main = "#545460", light = "#C8C4D2" }
plum = { main = "#8C2878", light = "#ECBADC" }
christmas = { main = "#C62828", light = "#F8D5C0" }
easter = { main = "#6E9E3A", light = "#F8DCE6" }
valentine = { main = "#C8346E", light = "#FAD6DC" }
halloween = { main = "#4A2E6B", light = "#B5D98A" }
new_year = { main = "#1E2A5A", light = "#E6DCF5" }
lunar_new_year = { main = "#B71C1C", light = "#F8D9B0" }
diwali = { main = "#C2185B", light = "#FFD9A0" }
eid_al_fitr = { main = "#00695C", light = "#E0F2E9" }
hanukkah = { main = "#1E4DB7", light = "#E3ECFF" }
nowruz = { main = "#5E8C3A", light = "#FADADD" }
solstice = { main = "#E67E22", light = "#FFF1B8" }
earth_day = { main = "#2E7D32", light = "#D7CCA8" }

# The body sets how the Overlord plays, on top of the rhythms it borrows.
# bpm: tempo change; beats: more beats per rhythm; offbeat, eighth: added
# chances; lanes: added chance of notes between beats in the lane phase.
[traits.robe]
name = { en = "Classic", de = "Klassisch" }
description = { en = "Plays the beaten bosses' rhythms as they are.", de = "Spielt die Rhythmen der besiegten Bosse, wie sie sind." }

[traits.armor]
name = { en = "Heavy", de = "Schwer" }
description = { en = "Slower, but longer rhythms.", de = "Langsamer, aber längere Rhythmen." }
bpm = -8
beats = 1

[traits.blob]
name = { en = "Wobbly", de = "Wabbelig" }
description = { en = "More beats between the beats.", de = "Mehr Schläge zwischen den Schlägen." }
offbeat = 0.25

[traits.sleeves]
name = { en = "Swift", de = "Flink" }
description = { en = "More quick eighth notes.", de = "Mehr schnelle Achtelnoten." }
eighth = 0.2

[traits.spider]
name = { en = "Skittering", de = "Krabbelig" }
description = { en = "A faster tempo.", de = "Ein schnelleres Tempo." }
bpm = 8

[traits.serpent]
name = { en = "Coiling", de = "Geschlängelt" }
description = { en = "More notes in the last phase.", de = "Mehr Noten in der letzten Phase." }
lanes = 0.1

# Beating a holiday Overlord gives its boon (effects like an item's, see
# game/README.md) for this many days.
[boons]
days = 14

# Holiday Overlords (opt-in in the settings): the week (Monday to Sunday)
# that contains the day. day = "MM-DD", "easter" (Easter Sunday) or
# "hanukkah" (its first day); or dates = [...] for holidays that follow the
# moon. When two turned-on holidays share a week, they take turns by year.
# The holiday parts replace the week's headgear, item, extra and colors;
# body (and with it the trait) and face stay the week's.
[holidays.christmas]
day = "12-24"
setting = { en = "Christmas", de = "Weihnachten" }
name = { en = "Tinsel Tyrant", de = "Lametta-Tyrann" }
trophy = { en = "Christmas Star", de = "Weihnachtsstern" }
hat = "santa"
item = "candy_cane"
extra = "snow"
scheme = "christmas"
boon = { hearts = 1 }

[holidays.easter]
day = "easter"
setting = { en = "Easter", de = "Ostern" }
name = { en = "Egg-Hoarding Hare", de = "Eierbunker-Hase" }
trophy = { en = "Golden Egg", de = "Goldenes Ei" }
hat = "bunny"
item = "egg"
extra = "eggs"
scheme = "easter"
boon = { loot_bonus = 15 }

