  { en = "of the Dripping Tap", de = "vom tropfenden Hahn" },
  { en = "of the Forgotten Dishes", de = "vom vergessenen Abwasch" },
  { en = "of the Mystery Stain", de = "vom rätselhaften Fleck" },
  { en = "of the Cluttered Hall", de = "vom vollgestellten Flur" },
