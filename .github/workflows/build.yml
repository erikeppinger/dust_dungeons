# Checks every push and builds a test APK and the Windows app. A tag v* also
# publishes both as a GitHub release, for testers.
#
# Test APKs are signed with the debug key. With the repository secret
# DEBUG_KEYSTORE_BASE64 (the base64 of a debug.keystore) every build uses
# the same key, so a newer test APK installs over an older one. Without it,
# each build gets the runner's own key and testers must uninstall first.
# Real release signing comes with the beta (docs/design/beta.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The tests run the art and game data checks, which are Python.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Use the shared test signing key
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/test.keystore"
            echo "TEST_KEYSTORE=$RUNNER_TEMP/test.keystore" >> "$GITHUB_ENV"
            echo "Signing with the shared test key."
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: this APK can't update earlier test installs."
          fi

      - run: flutter build apk --release

      - name: Check the APK's key and that it has no internet permission
        env:
          # The shared test key's certificate (public, like any APK's).
          EXPECTED: f091113a2a009611cdbc4b0dff03f4a2d4de0e6e6195b9f2e492f8fb80b58d55
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$TEST_KEYSTORE" ]; then
            if ! "$TOOLS/apksigner" verify --print-certs "$APK" | grep -qi "SHA-256 digest: $EXPECTED"; then
              echo "::error::The APK isn't signed with the shared test key."
              exit 1
            fi
          fi
          if "$TOOLS/aapt" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::The release APK requests INTERNET."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="homework-chores-${VERSION}-test.apk"
          else
            NAME="homework-chores-${VERSION}-${GITHUB_SHA::7}-test.apk"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          prerelease: true
          body: |
            Test build ${{ github.ref_name }}, before the beta. See CHANGELOG.md for what changed.

            Install: download the APK on the phone and open it (Android asks to allow installs from the browser or file manager once).

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip the app
        id: zip
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="homework-chores-${VERSION}-windows-test"
          else
            NAME="homework-chores-${VERSION}-${GITHUB_SHA::7}-windows-test"
          fi
          mv build/windows/x64/runner/Release "$NAME"
          7z a "$NAME.zip" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The folder, not the zip: GitHub zips artifacts itself.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          retention-days: 30

      - name: Add it to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.name }}.zip
          prerelease: true
